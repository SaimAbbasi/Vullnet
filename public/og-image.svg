  <!-- VNG logomark -->
  <g transform="translate(80, 215) scale(2)" stroke="#d83030" stroke-linecap="round" fill="none">
    <line stroke-width="2" x1="50" y1="76" x2="24" y2="0"/>
    <line stroke-width="2" x1="50" y1="76" x2="12" y2="0"/>
    <line stroke-width="2" x1="50" y1="76" x2="2" y2="0"/>
    <line stroke-width="2" x1="50" y1="76" x2="0" y2="16"/>
    <line stroke-width="2" x1="50" y1="76" x2="0" y2="43"/>
    <line stroke-width="2" x1="50" y1="76" x2="0" y2="71"/>
    <line stroke-width="2" x1="50" y1="76" x2="76" y2="0"/>
    <line stroke-width="2" x1="50" y1="76" x2="88" y2="0"/>
    <line stroke-width="2" x1="50" y1="76" x2="98" y2="0"/>
